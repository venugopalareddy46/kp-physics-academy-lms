services:
  app:
    build: .
    environment:
      SQLITE_PATH: /app/data/kp-physics.sqlite
      APP_URL: http://localhost:3000
      JWT_SECRET: change-me-to-a-long-secret
      COOKIE_NAME: kp_session
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET: kp-lms-media
      R2_PUBLIC_BASE_URL: ""
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      FLUTTERFLOW_ORIGIN: ""
    ports:
      - "3000:3000"
    volumes:
      - kp_sqlite:/app/data
volumes:
  kp_sqlite:
